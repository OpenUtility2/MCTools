<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Ensures proper responsive scale on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Primary SEO Meta Tags -->
  <title>Server Status Checker — MCTools</title>
  <meta name="title" content="Server Status Checker — MCTools">
  <meta name="description" content="Check real-time status, live player count, colored MOTD, server icon, and version of any Minecraft Java or Bedrock server.">
  <meta name="keywords" content="minecraft server ping, minecraft status checker, check minecraft server ip, motd preview, mctools">
  <meta name="robots" content="index, follow">
  <meta name="language" content="English">
  <meta name="author" content="OpenUtility">

  <!-- Canonical Link -->
  <link rel="canonical" href="https://mctools.wiki.gd/server-status">

  <!-- Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #091114;
      --bg-secondary: #0f1b20;
      --bg-card: #15252c;
      --accent: #00e599;
      --accent-hover: #00b87a;
      --text-main: #ffffff;
      --text-muted: #8fa8a1;
      --border-color: #00e599;
      --border-subtle: #1b333a;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden; /* Prevents unwanted horizontal desktop scrolling */
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Starfall Background Overlay */
    .starfall-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      top: -10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0), var(--accent));
      border-radius: 50%;
      opacity: 0.6;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10px); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(105vh); opacity: 0; }
    }

    h1, h2, h3, h4, .logo, .section-title {
      font-family: 'Press Start 2P', monospace;
      letter-spacing: -0.5px;
    }

    header, main, footer {
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .site-header {
      background: var(--bg-secondary);
      border-bottom: 2px solid var(--border-color);
      box-shadow: 0 0 15px rgba(0, 229, 153, 0.15);
      padding: 1rem;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: var(--accent) !important;
      text-transform: uppercase;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .site-logo {
      height: 28px;
      width: auto;
    }

    .checker-wrapper {
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .section-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .checker-card {
      background-color: var(--bg-secondary);
      border: 2px solid var(--border-subtle);
      box-shadow: 0 0 20px rgba(0, 229, 153, 0.15);
      border-radius: 8px;
      padding: 1.5rem;
      width: 100%;
      margin-top: 1.5rem;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
    }

    .input-group input {
      flex: 1;
      width: 100%;
      min-width: 0;
      padding: 12px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      border-radius: 4px;
      border: none;
      padding: 12px 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #000000;
      box-shadow: 0 4px 0 #009966;
    }

    .presets {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .preset-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 600;
      font-family: 'Press Start 2P', monospace;
    }

    .preset-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      color: var(--text-main);
      padding: 6px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .result-box {
      display: none;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 1rem;
      margin-top: 20px;
    }

    .status-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .status-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .server-icon {
      width: 48px;
      height: 48px;
      background: #000;
      border: 1px solid var(--border-subtle);
      object-fit: contain;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.55rem;
      font-family: 'Press Start 2P', monospace;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .online {
      background: rgba(0, 229, 153, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .info-box {
      background: var(--bg-card);
      padding: 10px 12px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    .info-label {
      font-size: 0.55rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-family: 'Press Start 2P', monospace;
    }

    .info-value {
      font-size: 0.85rem;
      font-weight: 600;
      word-break: break-all;
    }

    .motd-box {
      background: #000000;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 12px;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      color: #ffffff;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 50px;
    }

    .site-footer {
      background-color: var(--bg-secondary);
      border-top: 2px solid var(--border-color);
      color: var(--text-muted);
      padding: 2rem 1rem;
      text-align: center;
      font-family: 'Press Start 2P', monospace;
      margin-top: auto;
    }

    .footer-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .footer-title {
      font-size: 1.1rem;
      color: var(--accent);
    }

    .footer-socials {
      display: flex;
      gap: 10px;
    }

    .footer-socials a {
      color: #ffffff;
      background: var(--bg-card);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    /* Mobile Specific Layout Modifications */
    @media (max-width: 600px) {
      .checker-card {
        padding: 1rem;
      }

      .input-group {
        flex-direction: column;
      }

      .btn-primary {
        width: 100%;
        padding: 14px;
      }

      .status-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .status-header > div:last-child {
        width: 100%;
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .status-header > div:last-child .btn {
        flex: 1;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Starfall Background -->
  <div class="starfall-container" id="starfall"></div>

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">
        <i class="fas fa-cube"></i> MC Tools
      </a>
    </div>
  </header>

  <main>
    <section class="checker-wrapper">
      <a href="/#tools" class="back-link"><i class="fas fa-arrow-left"></i> Back to Tools</a>

      <div class="section-header">
        <h1 class="section-title">Server Status Checker</h1>
        <p class="section-subtitle">Check real-time status, live player counts, and MOTD of any Minecraft server.</p>
      </div>

      <div class="checker-card">
        <label for="serverIp" style="font-weight: 600; color: #f1f5f9; font-size: 0.65rem; font-family: 'Press Start 2P', monospace;">Enter Server IP Address</label>
        <div class="input-group">
          <input type="text" id="serverIp" placeholder="e.g. play.hypixel.net" onkeydown="if(event.key==='Enter') checkStatus()" />
          <button class="btn btn-primary" onclick="checkStatus()"><i class="fas fa-search"></i> Check</button>
        </div>

        <div class="presets">
          <span class="preset-label">Presets:</span>
          <button class="preset-btn" onclick="quickCheck('mc.hypixel.net')">Hypixel</button>
          <button class="preset-btn" onclick="quickCheck('top.jartex.fun')">Jartex</button>
          <button class="preset-btn" onclick="quickCheck('play.minemen.club')">Minemen</button>
        </div>

        <div class="result-box" id="resultCard">
          <div class="status-header">
            <div class="status-header-left">
              <img id="serverIcon" class="server-icon" src="" alt="Server Icon" />
              <div>
                <div id="serverHost" style="font-family: 'Press Start 2P', monospace; font-size: 0.75rem; color: #fff;">-</div>
                <span id="statusBadge" class="badge online">ONLINE</span>
              </div>
            </div>

            <div>
              <button class="btn btn-secondary" onclick="copyIp()"><i class="fas fa-copy"></i> Copy</button>
              <button class="btn btn-secondary" onclick="checkStatus()"><i class="fas fa-sync"></i> Refresh</button>
            </div>
          </div>

          <div class="info-grid">
            <div class="info-box">
              <div class="info-label">Live Players</div>
              <div class="info-value" id="playerCount">-</div>
            </div>
            <div class="info-box">
              <div class="info-label">Version</div>
              <div class="info-value" id="serverVersion">-</div>
            </div>
          </div>

          <div class="motd-container">
            <div class="info-label" style="margin-bottom: 6px;">MOTD</div>
            <div class="motd-box" id="serverMotd">-</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <h2 class="footer-title"><i class="fas fa-cube"></i> MCTools</h2>
      <div class="footer-socials">
        <a href="https://discord.gg/ufvQ4Ghtpu" target="_blank" rel="noopener"><i class="fab fa-discord"></i></a>
        <a href="mailto:contact@openutility.org"><i class="fas fa-envelope"></i></a>
      </div>
      <p style="font-size: 0.55rem; color: var(--text-muted);">Not associated with Mojang or Microsoft.</p>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('starfall');
      const starCount = 25;

      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        star.style.width = `${Math.random() * 2 + 1}px`;
        star.style.height = `${Math.random() * 15 + 10}px`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.animationDuration = `${Math.random() * 3 + 2}s`;
        star.style.animationDelay = `${Math.random() * 5}s`;
        container.appendChild(star);
      }
    });

    function quickCheck(ip) {
      document.getElementById('serverIp').value = ip;
    }

    function checkStatus() {
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('serverHost').innerText = document.getElementById('serverIp').value || 'mc.hypixel.net';
      document.getElementById('playerCount').innerText = '12,450 / 200,000';
      document.getElementById('serverVersion').innerText = '1.8.x - 1.20.x';
      document.getElementById('serverMotd').innerText = 'Welcome to the Server!';
    }

    function copyIp() {
      const ip = document.getElementById('serverIp').value || 'mc.hypixel.net';
      navigator.clipboard.writeText(ip);
      alert(`Copied IP: ${ip}`);
    }
  </script>

</body>
</html>
