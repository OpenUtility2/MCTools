<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Dark Purple Pixel Pattern -->
    <pattern id="pixel-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#12081f"/>
      <circle cx="5" cy="5" r="2" fill="#25143a"/>
      <circle cx="20" cy="20" r="2" fill="#1d0e30"/>
    </pattern>

    <!-- Glowing Blue Accent Gradient -->
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4e8c"/>
      <stop offset="100%" stop-color="#1a2035"/>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#pixel-grid)"/>

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#2b3a67" stroke-width="6"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#3d2856" stroke-width="2"/>

  <!-- Corner Pixel Accents -->
  <rect x="20" y="20" width="24" height="24" fill="#2b3a67"/>
  <rect x="1156" y="20" width="24" height="24" fill="#2b3a67"/>
  <rect x="20" y="586" width="24" height="24" fill="#2b3a67"/>
  <rect x="1156" y="586" width="24" height="24" fill="#2b3a67"/>

  <!-- Central Panel Card -->
  <rect x="80" y="80" width="1040" height="470" fill="#1a102a" stroke="#000" stroke-width="6"/>
  <rect x="74" y="74" width="1052" height="482" fill="none" stroke="#3d2856" stroke-width="3"/>

  <!-- Minecraft Style Dirt/Grass Block Icon Graphic -->
  <g transform="translate(140, 150)">
    <!-- Block Base -->
    <rect x="0" y="0" width="120" height="120" fill="#866043" stroke="#000" stroke-width="4"/>
    <!-- Dirt Pixel Details -->
    <rect x="20" y="60" width="15" height="15" fill="#573d26"/>
    <rect x="70" y="80" width="20" height="15" fill="#573d26"/>
    <rect x="40" y="90" width="15" height="15" fill="#573d26"/>
    <!-- Grass Top Layer -->
    <rect x="0" y="0" width="120" height="40" fill="#5c8e32"/>
    <rect x="0" y="35" width="20" height="15" fill="#5c8e32"/>
    <rect x="35" y="35" width="25" height="20" fill="#5c8e32"/>
    <rect x="80" y="35" width="20" height="15" fill="#5c8e32"/>
    <!-- Block Highlight Line -->
    <rect x="0" y="0" width="120" height="6" fill="#7ebd3e"/>
  </g>

  <!-- Title & Branding Text -->
  <g transform="translate(300, 190)">
    <!-- Main Title Shadow -->
    <text x="4" y="54" font-family="'Courier New', monospace" font-size="64" font-weight="900" fill="#000" letter-spacing="-2">MCTOOLS</text>
    <!-- Main Title -->
    <text x="0" y="50" font-family="'Courier New', monospace" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-2">MCTOOLS</text>
    
    <!-- Subtitle -->
    <text x="0" y="95" font-family="sans-serif" font-size="24" font-weight="600" fill="#b8a8d0">Free Minecraft Server Tools &amp; Utilities</text>
  </g>

  <!-- Feature Badge Cards (4 Main Tools) -->
  <g transform="translate(130, 330)">
    <!-- Tool 1 -->
    <rect x="0" y="0" width="210" height="70" fill="#1b0e2d" stroke="#000" stroke-width="3"/>
    <rect x="0" y="0" width="210" height="4" fill="#2b3a67"/>
    <text x="105" y="40" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">server.properties</text>
    <text x="105" y="58" font-family="sans-serif" font-size="11" fill="#b8a8d0" text-anchor="middle">Visual Editor</text>

    <!-- Tool 2 -->
    <rect x="235" y="0" width="210" height="70" fill="#1b0e2d" stroke="#000" stroke-width="3"/>
    <rect x="235" y="0" width="210" height="4" fill="#2b3a67"/>
    <text x="340" y="40" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">MOTD Generator</text>
    <text x="340" y="58" font-family="sans-serif" font-size="11" fill="#b8a8d0" text-anchor="middle">Color &amp; Format</text>

    <!-- Tool 3 -->
    <rect x="470" y="0" width="210" height="70" fill="#1b0e2d" stroke="#000" stroke-width="3"/>
    <rect x="470" y="0" width="210" height="4" fill="#2b3a67"/>
    <text x="575" y="40" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Java Flags</text>
    <text x="575" y="58" font-family="sans-serif" font-size="11" fill="#b8a8d0" text-anchor="middle">RAM Optimizer</text>

    <!-- Tool 4 -->
    <rect x="705" y="0" width="210" height="70" fill="#1b0e2d" stroke="#000" stroke-width="3"/>
    <rect x="705" y="0" width="210" height="4" fill="#2b3a67"/>
    <text x="810" y="40" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Status Checker</text>
    <text x="810" y="58" font-family="sans-serif" font-size="11" fill="#b8a8d0" text-anchor="middle">Live Ping &amp; Players</text>
  </g>

  <!-- Footer Info Line -->
  <g transform="translate(0, 485)">
    <text x="600" y="0" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#2b3a67" text-anchor="middle" letter-spacing="1">https://mctools.wiki.gd</text>
    <text x="600" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8c7aa8" text-anchor="middle">POWERED BY OPENUTILITY</text>
  </g>
</svg>
      
